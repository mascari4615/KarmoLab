<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project M.A.G.I. - Chat Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans KR', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#FF6B6B', 600: '#EE5D88' },
                        dark: { 800: '#2D2D2D', 900: '#1A1A1A' }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden bg-[url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=2568&auto=format&fit=crop')] bg-cover bg-center">
    
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>

    <div class="glass-panel relative w-full h-full max-w-[1200px] md:h-[85vh] md:rounded-2xl flex flex-col md:flex-row overflow-hidden">
        
        <!-- Left Panel (Settings & Char Select) -->
        <div class="w-full md:w-[320px] flex flex-col border-r border-white/10 bg-dark-900/50">
            <!-- Header -->
            <div class="p-6 border-b border-white/10">
                <h1 class="text-xl font-bold text-white flex items-center gap-2"><span>💬</span> M.A.G.I. Chat</h1>
                <p class="text-[10px] text-gray-400 mt-0.5">Mendokusai AI Generation Interface</p>

                <!-- API Key Input -->
                <div class="mt-4 p-3 bg-black/30 rounded-lg border border-white/10">
                    <div class="flex items-center gap-2 mb-2">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">🔑 Gemini API Key</label>
                        <a href="https://aistudio.google.com/apikey" target="_blank" class="text-[9px] text-brand-500 hover:text-brand-400 underline">Get Key</a>
                    </div>
                    <div class="flex gap-2">
                        <input type="password" id="apiKeyInput" placeholder="AIza..." class="flex-1 px-3 py-2 bg-black/50 border border-white/10 rounded text-xs text-white focus:border-brand-500/50 focus:outline-none" />
                        <button onclick="saveApiKey()" class="px-3 py-2 bg-brand-500 hover:bg-brand-600 rounded text-xs font-bold text-white transition">Save</button>
                    </div>
                    <p id="apiKeyStatus" class="text-[9px] text-gray-500 mt-1.5"></p>
                </div>

                <!-- Model Selector -->
                <div class="mt-3 p-3 bg-black/30 rounded-lg border border-white/10">
                    <label class="text-[10px] font-bold text-gray-400 uppercase mb-2 block">🤖 AI Model</label>
                    <select id="modelSelect" class="w-full bg-black/50 border border-white/10 rounded text-xs text-white p-2 focus:border-brand-500/50 focus:outline-none">
                        <option value="gemini-3-flash-preview" selected>Gemini 3 Flash Preview</option>
                        <option value="gemini-2.5-pro" selected>Gemini 2.5 Pro</option>
                        <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
                        <option value="gemini-2.5-flash-preview-09-2025" selected>Gemini 2.5 Flash Preview 09-2025</option>
                        <option value="gemini-2.5-flash-lite" selected>Gemini 2.5 Flash Lite</option>
                        <option value="gemini-2.5-flash-lite-preview-09-2025" selected>Gemini 2.5 Flash Lite Preview 09-2025</option>
                    </select>
                </div>
            </div>

            <!-- Character List -->
            <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-2">
                <label class="text-xs font-bold text-gray-500 uppercase px-2 mb-2 block">Select Character</label>
                
                <button onclick="selectChar('witch')" id="char-witch" class="char-card active w-full p-3 rounded-xl flex items-center gap-3 text-left group">
                    <div class="w-10 h-10 rounded-full bg-orange-500/20 flex items-center justify-center text-xl border border-orange-500/30">💤</div>
                    <div>
                        <div class="text-sm font-bold text-white group-hover:text-brand-500 transition">Witch Yawn</div>
                        <div class="text-[10px] text-gray-400">Lazy, Sleepy, Genius</div>
                    </div>
                </button>

                <button onclick="selectChar('alisa')" id="char-alisa" class="char-card w-full p-3 rounded-xl flex items-center gap-3 text-left group">
                    <div class="w-10 h-10 rounded-full bg-blue-500/20 flex items-center justify-center text-xl border border-blue-500/30">🧹</div>
                    <div>
                        <div class="text-sm font-bold text-white group-hover:text-brand-500 transition">Maid Alisa</div>
                        <div class="text-[10px] text-gray-400">Stoic, Strict, Loyal</div>
                    </div>
                </button>

                <button onclick="selectChar('ling')" id="char-ling" class="char-card w-full p-3 rounded-xl flex items-center gap-3 text-left group">
                    <div class="w-10 h-10 rounded-full bg-purple-500/20 flex items-center justify-center text-xl border border-purple-500/30">🧟‍♀️</div>
                    <div>
                        <div class="text-sm font-bold text-white group-hover:text-brand-500 transition">Jiangshi Ling</div>
                        <div class="text-[10px] text-gray-400">Cute, Energetic, Baby</div>
                    </div>
                </button>

                <div class="h-px bg-white/10 my-2"></div>

                <button onclick="selectChar('director')" id="char-director" class="char-card w-full p-3 rounded-xl flex items-center gap-3 text-left group">
                    <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center text-xl border border-green-500/30">🎬</div>
                    <div>
                        <div class="text-sm font-bold text-white group-hover:text-brand-500 transition">Director Mode</div>
                        <div class="text-[10px] text-gray-400">Story, Lore, Random Ideas</div>
                    </div>
                </button>
            </div>

            <!-- Footer -->
            <div class="p-4 border-t border-white/10 text-[10px] text-gray-600 text-center">
                Powered by Gemini 2.0 Flash
            </div>
        </div>

        <!-- Right Panel (Chat Area) -->
        <div class="flex-1 flex flex-col bg-dark-900 relative">
            <!-- Chat Header -->
            <div class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 to-transparent z-10 flex justify-between items-center pointer-events-none">
                <div class="flex items-center gap-2 pointer-events-auto">
                    <span id="chatHeaderIcon" class="text-xl">💤</span>
                    <div>
                        <h2 id="chatHeaderName" class="text-sm font-bold text-white">Witch Yawn</h2>
                        <p id="chatHeaderStatus" class="text-[10px] text-green-400">● Online</p>
                    </div>
                </div>
                <button onclick="clearChat()" class="pointer-events-auto px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-[10px] text-gray-400 hover:text-white transition border border-white/5">
                    🗑️ Clear Chat
                </button>
            </div>

            <!-- Messages -->
            <div id="chatHistory" class="flex-1 overflow-y-auto custom-scroll p-4 pt-20 pb-4 space-y-4">
                <!-- Welcome Message -->
                <div class="flex justify-start">
                    <div class="chat-bubble bot">
                        안녕... 졸려... 무슨 일이야? (하품)
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-black/40 border-t border-white/10">
                <div class="relative">
                    <textarea id="chatInput" onkeydown="handleEnter(event)" placeholder="메시지를 입력하세요..." class="w-full bg-white/5 border border-white/10 rounded-xl p-4 pr-12 text-sm text-white focus:border-brand-500/50 focus:outline-none resize-none h-14 custom-scroll"></textarea>
                    <button onclick="sendMessage()" id="sendBtn" class="absolute right-2 top-2 bottom-2 w-10 bg-brand-500 hover:bg-brand-600 rounded-lg flex items-center justify-center text-white transition shadow-lg shadow-brand-500/20">
                        ➤
                    </button>
                </div>
                <div class="flex justify-between items-center mt-2 px-1">
                    <p id="tokenUsageDisplay" class="text-[10px] text-gray-500 font-mono">Tokens: 0 / 1,000,000</p>
                    <p class="text-[10px] text-gray-600">AI can make mistakes. Check important info.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Toast Container -->
    <div id="errorToastContainer" class="fixed bottom-0 right-0 p-4 space-y-3 pointer-events-none z-[9999]"></div>

    <script src="js/prompts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
