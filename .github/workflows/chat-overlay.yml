name: Chat overlay checks

on:
  push:
    branches: [main]
    paths: ['apps/chat-overlay/**', '.github/workflows/chat-overlay.yml']
  pull_request:
    paths: ['apps/chat-overlay/**', '.github/workflows/chat-overlay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chat-overlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/chat-overlay/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
