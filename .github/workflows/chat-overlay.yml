name: Chat overlay checks

on:
  push:
    branches: [main]
    paths: ['apps/chat-overlay/**', '.github/workflows/chat-overlay.yml']
  pull_request:
    paths: ['apps/chat-overlay/**', '.github/workflows/chat-overlay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chat-overlay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/chat-overlay/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
