name: Desktop dependency checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/chat-overlay/src-tauri/**'
      - 'apps/karmolab-tauri/**'
      - 'vendor/glib-0.18.5/**'
      - '.github/workflows/rust-security.yml'
  pull_request:
    paths:
      - 'apps/chat-overlay/src-tauri/**'
      - 'apps/karmolab-tauri/**'
      - 'vendor/glib-0.18.5/**'
      - '.github/workflows/rust-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gtk-iterator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - run: cargo test --release --manifest-path vendor/glib-0.18.5/Cargo.toml --lib variant_iter::tests

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/chat-overlay/src-tauri -> target
            apps/karmolab-tauri -> target
      - run: cargo check --locked --all-targets --manifest-path apps/chat-overlay/src-tauri/Cargo.toml
      - name: Prepare compile-only sidecar placeholder
        shell: pwsh
        run: |
          $bin = 'apps/karmolab-tauri/src-tauri/binaries/karmolab-life-ml-x86_64-pc-windows-msvc.exe'
          if (!(Test-Path -LiteralPath $bin)) {
            New-Item -ItemType Directory -Path (Split-Path -Parent $bin) -Force | Out-Null
            New-Item -ItemType File -Path $bin | Out-Null
          }
      - run: cargo test --locked --manifest-path apps/karmolab-tauri/Cargo.toml -p karmolab-desktop --lib schema -- --test-threads=1
