name: Deploy WM atlas

on:
  push:
    branches: [main]
    paths:
      - 'apps/wm/**'
      - '.github/workflows/deploy-wm-atlas.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-wm-atlas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wm/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Deploy atlas assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.164.0 deploy
