name: Bot hostname (터널에 봇 주소 붙이기)

# 봇 API 주소를 yawnbot.mascari4615.com 에서 bot.mascari4615.com 으로 옮길 때 쓴다 (2026-09-25).
# 원격 관리 터널의 ingress 에 새 주소를 옛 주소와 같은 서비스로 더하고, DNS CNAME 을 만든다.
# 옛 주소는 지우지 않는다. apply 를 끄면 찾은 것과 할 일을 찍기만 한다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 붙인다 (false 면 찍기만)"
        type: boolean
        default: false
      old_host:
        description: "옛 주소"
        default: "yawnbot.mascari4615.com"
      new_host:
        description: "새 주소"
        default: "bot.mascari4615.com"

permissions:
  contents: read

concurrency:
  group: bot-hostname
  cancel-in-progress: false

jobs:
  hostname:
    runs-on: ubuntu-latest
    steps:
      - name: 터널과 ingress 찾기, 새 주소 붙이기
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
          OLD_HOST: ${{ inputs.old_host }}
          NEW_HOST: ${{ inputs.new_host }}
        run: |
          set -euo pipefail
          ACC=ce18bd3c1df233b3cd533ef0623cbafe
          API=https://api.cloudflare.com/client/v4
          H=(-H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")

          curl -s "${H[@]}" "$API/accounts/$ACC/cfd_tunnel?is_deleted=false&per_page=50" > /tmp/tunnels.json
          node -e 'const j=require("/tmp/tunnels.json"); if(!j.success){console.log(JSON.stringify(j.errors));process.exit(1)} for(const t of j.result) console.log("tunnel", t.id, t.name, t.status, t.remote_config)'

          FOUND=""
          for T in $(node -e 'for(const t of require("/tmp/tunnels.json").result) console.log(t.id)'); do
            curl -s "${H[@]}" "$API/accounts/$ACC/cfd_tunnel/$T/configurations" > /tmp/cfg-$T.json
            if node -e 'const j=require(process.argv[1]); const ing=(j.result&&j.result.config&&j.result.config.ingress)||[]; process.exit(ing.some(r=>r.hostname===process.argv[2])?0:1)' /tmp/cfg-$T.json "$OLD_HOST"; then FOUND=$T; fi
          done
          if [ -z "$FOUND" ]; then echo "::error::$OLD_HOST 를 가진 원격 관리 터널을 못 찾았다 (로컬 설정 터널이면 대시보드나 노트북 config 에서)"; exit 1; fi
          echo "터널: $FOUND"
          node -e 'const j=require(process.argv[1]); for(const r of j.result.config.ingress) console.log("ingress", r.hostname||"(나머지)", r.service)' /tmp/cfg-$FOUND.json

          node -e '
            const fs=require("fs"); const j=require(process.argv[1]); const oldH=process.argv[2], newH=process.argv[3];
            const cfg=j.result.config; const ing=cfg.ingress;
            if (ing.some(r=>r.hostname===newH)) { console.log("이미 있음:", newH); fs.writeFileSync("/tmp/new-cfg.json",""); process.exit(0); }
            const old=ing.find(r=>r.hostname===oldH);
            const rule={...old, hostname:newH};
            const i=ing.indexOf(old); ing.splice(i+1,0,rule);
            fs.writeFileSync("/tmp/new-cfg.json", JSON.stringify({config:cfg}));
            console.log("더할 규칙:", JSON.stringify(rule));
          ' /tmp/cfg-$FOUND.json "$OLD_HOST" "$NEW_HOST"

          curl -s "${H[@]}" "$API/zones?name=mascari4615.com" > /tmp/zone.json
          ZONE=$(node -e 'const j=require("/tmp/zone.json"); console.log(j.result&&j.result[0]?j.result[0].id:"")')
          echo "zone: ${ZONE:-(못 찾음)}"
          curl -s "${H[@]}" "$API/zones/$ZONE/dns_records?name=$NEW_HOST" > /tmp/dns.json
          node -e 'const j=require("/tmp/dns.json"); console.log("dns 조회", j.success, (j.result||[]).map(r=>r.type+" "+r.content).join(", ")||"(없음)", JSON.stringify(j.errors||[]))'

          if [ "$APPLY" != "true" ]; then echo "찍기만 했다 (apply=false)"; exit 0; fi

          if [ -s /tmp/new-cfg.json ]; then
            curl -s -X PUT "${H[@]}" "$API/accounts/$ACC/cfd_tunnel/$FOUND/configurations" --data @/tmp/new-cfg.json > /tmp/put.json
            node -e 'const j=require("/tmp/put.json"); console.log("ingress 갱신", j.success, JSON.stringify(j.errors||[])); if(!j.success) process.exit(1)'
          fi
          if node -e 'process.exit((require("/tmp/dns.json").result||[]).length?0:1)'; then
            echo "DNS 이미 있음"
          else
            curl -s -X POST "${H[@]}" "$API/zones/$ZONE/dns_records" \
              --data "{\"type\":\"CNAME\",\"name\":\"$NEW_HOST\",\"content\":\"$FOUND.cfargotunnel.com\",\"proxied\":true,\"comment\":\"bot API (yawnbot 에서 이전)\"}" > /tmp/dnsp.json
            node -e 'const j=require("/tmp/dnsp.json"); console.log("DNS 생성", j.success, JSON.stringify(j.errors||[])); if(!j.success) process.exit(1)'
          fi

          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://$NEW_HOST/kl/health" || echo 000)
            echo "https://$NEW_HOST/kl/health -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::새 주소 health 가 아직 200 이 아니다 (DNS 전파 대기일 수 있다)"
