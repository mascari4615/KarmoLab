name: Deploy site-router Worker

# lab.mascari4615.com, dash.mascari4615.com 을 받는 Worker 를 push 로 내보낸다 (memo change.site-split).
# 저장소 Secret `CLOUDFLARE_API_TOKEN` 은 files 워커와 같은 것. 없으면 이 잡이 빨갛게 실패한다.

on:
  push:
    branches: [main]
    paths:
      - 'apps/site-router/worker.mjs'
      - 'apps/site-router/wrangler.toml'
      - 'apps/site-router/src/**'
      - '.github/workflows/deploy-site-router.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-site-router
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # 배포 전에 이 Worker 의 시험을 돌린다. 캐시 계약, 빈 키 처리가 여기서 깨지면
      # 사이트가 아니라 **클라우드 전체**가 안 열린다 (열쇠 재료가 그 안에 있다).
      - name: Test site-router
        working-directory: apps/site-router
        run: npm test

      - name: Check token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 이 없다. 저장소 Secret 에 넣어야 Worker 가 나간다."
            echo "만드는 곳: Cloudflare 대시보드 → My Profile → API Tokens → Edit Cloudflare Workers"
            exit 1
          fi

      - name: Deploy worker
        working-directory: apps/site-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
