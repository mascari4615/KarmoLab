name: "KarmoLab 오락실 검사"

# 왜 따로 있나 (2026-11-16 사용자 결정: 지금 안 쓰는 오락실의 검사는 끈다)
#
# 오락실 검사 21개가 CI verify 검사 시간의 약 44% (직렬 577초 / 1300초) 를 썼다.
# verify 묶음 (data/gate-list.json) 에서 빼고 주 1회 여기서만 돈다. 배포도 verify 도 안 막는다.
# 목록은 `apps/karmolab/package.json` 의 `gates:arcade`. 오락실을 다시 쓰면 그 이름들을 gate-list 로 되돌린다.

on:
  schedule:
    # 매주 수 18:50 UTC (한국 목요일 새벽 3시 50분)
    - cron: '50 18 * * 3'
  workflow_dispatch:

concurrency:
  group: karmolab-arcade-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  arcade:
    name: 오락실 검사
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/karmolab/package-lock.json
            packages/ai/package-lock.json
            packages/mcp/package-lock.json
      - uses: ./.github/actions/setup-karmolab
        with:
          node-version: '20'
          chromium: 'true'
      - name: Build (게이트 제외)
        working-directory: apps/karmolab
        env:
          KL_GATES_DEFER: '1'
        run: npm run build:direct
      - name: 오락실 검사 21개
        working-directory: apps/karmolab
        env:
          KL_GATE_JOBS: '2'
        run: npm run gates:arcade