<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KarmoDevExtension 설정</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        margin-bottom: 0.35rem;
        font-weight: 600;
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem 0.6rem;
        font-size: 1rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
        align-items: center;
      }
      button {
        padding: 0.45rem 1rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button.secondary {
        background: #f0f0f0;
        border: 1px solid #ccc;
      }
      #status {
        margin-top: 0.75rem;
        min-height: 1.25rem;
        color: #0a0;
      }
      p.hint {
        font-size: 0.9rem;
        color: #444;
        margin-top: 0.5rem;
      }
      #lists li { display: flex; gap: 0.5rem; align-items: center; margin: 0.2rem 0; }
      #lists code { color: #666; }
    </style>
  </head>
  <body>
    <h1>KarmoDevExtension</h1>
    <p class="hint">chat-overlay(Tauri) ingest 주소. 포트를 바꿨으면 여기도 맞춥니다.</p>
    <label for="ingestUrl">Ingest URL</label>
    <input
      id="ingestUrl"
      type="url"
      spellcheck="false"
      autocomplete="off"
      placeholder="http://127.0.0.1:17376/ingest"
      autofocus
    />
    <div class="row">
      <button type="button" id="save">저장</button>
      <button type="button" id="resetDefault" class="secondary">기본 주소로 저장</button>
    </div>
    <p id="status" aria-live="polite"></p>
    <h2>유저 차단, 좋아요</h2>
    <p class="hint">아카라이브 글 줄에 마우스를 올리면 나오는 ♥ (좋아요, 줄 바탕이 분홍) 와 × (차단, 숨기고 페이지 맨 아래 블록에 모음) 로 추가.</p>
    <h3>같은 유저의 글 이어 보기</h3>
    <p class="hint">한 페이지에 두 줄 이상 쓴 유저를 유저마다 다른 색으로.</p>
    <label><input type="radio" name="linkStyle" value="lines" /> 왼쪽 여백 세로선</label>
    <label><input type="radio" name="linkStyle" value="stripe" /> 줄 왼쪽 색 띠</label>
    <label><input type="radio" name="linkStyle" value="off" /> 끔</label>
    <div class="row">
      <button type="button" id="listExport" class="secondary">JSON 내보내기</button>
      <button type="button" id="listImport" class="secondary">JSON 가져오기 (합침)</button>
      <input type="file" id="listFile" accept="application/json" hidden />
    </div>
    <div id="lists"></div>
    <script src="options.js"></script>
  </body>
</html>
