name = "site-router"
main = "worker.mjs"
compatibility_date = "2026-09-22"

# 이름은 Worker 가 받고 내용은 Pages 배포 셋에서 (memo change.site-split)
# custom_domain 이면 wrangler 가 DNS 레코드까지 만든다 (mydash-relay 와 같은 손)
# apex 와 www 는 안내 한 장 (src/landing.mjs)
routes = [
  { pattern = "lab.mascari4615.com", custom_domain = true },
  { pattern = "blog.mascari4615.com", custom_domain = true },
  { pattern = "dash.mascari4615.com", custom_domain = true },
  { pattern = "mascari4615.com", custom_domain = true },
  { pattern = "www.mascari4615.com", custom_domain = true },
]

[vars]
ORIGIN = "https://karmolab-lab.pages.dev"
