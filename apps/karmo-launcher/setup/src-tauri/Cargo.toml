# Karmo Launcher 자체 설치 화면. 실제 설치는 안에 넣은 NSIS 설치 파일을 숨겨 실행.
# 정본: memo/notes/launcher/setup-ui/README.md
[package]
name = "karmo-launcher-setup"
version = "0.1.0"
description = "Karmo Launcher Setup"
authors = ["mascari4615"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[patch.crates-io]
glib = { path = "../../../../vendor/glib-0.18.5" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[workspace]
