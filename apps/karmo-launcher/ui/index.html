<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karmo Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <b class="brand">Karmo Launcher</b>
  <span class="top-sub">라이브러리</span>
  <span class="top-msg" id="msg"></span>

</header>
<main class="main">
  <section class="grid" id="grid" aria-label="라이브러리"></section>
  <aside class="detail" id="detail" hidden></aside>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
