# 런처. 내 프로그램 (KarmoLab, Dash, WM 등) 목록, 받기, 설치, 버전, 실행.
# 정본: memo/changes/launcher.md. karmolab-tauri 워크스페이스와 따로 (그쪽 ML sidecar, vendor patch 를 안 끌어옴)
[package]
name = "karmo-launcher"
version = "0.1.2"
description = "Karmo launcher"
authors = ["mascari4615"]
edition = "2021"

[lib]
name = "karmo_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
open = "5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
