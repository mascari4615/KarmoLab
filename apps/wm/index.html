<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#182a29"><meta name="description" content="Witch Mendokusai의 세계. 숲속 욘의 집에서 시작해 바다 너머까지, 지도와 행성으로 탐색하는 세계 기록.">
  <link rel="canonical" href="https://wm.mascari4615.com/atlas/">
  <title>WM, 세계 지도</title>
  <link rel="icon" type="image/svg+xml" href="/emblem.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="%BASE_URL%" aria-label="Witch Mendokusai 홈"><img src="/emblem.svg" alt="" width="34" height="34"><span>WITCH MENDOKUSAI<small>세계의 기록</small></span></a>
    <nav aria-label="주 메뉴"><button class="nav-item active" data-page="world" aria-current="page">세계</button><button class="nav-item" data-page="characters">인물</button><button class="nav-item" data-page="archive">기록</button></nav>
    <div class="header-actions"><button id="world-library" aria-label="행성 선택">행성 선택</button><button id="edit-toggle" aria-pressed="false">세계 편집</button><button id="about-button" class="about-button" aria-label="이 세계에 관하여">WM <span>↗</span></button></div>
  </header>
  <main id="world-view">
    <div id="stage" aria-label="세계 지도 탐색 영역">
      <canvas id="map" tabindex="0" aria-label="평면 지도. 방향키로 이동, 더하기와 빼기로 확대와 축소"></canvas>
      <div id="planet" hidden></div>
      <div id="labels" aria-label="지도 위 장소"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div id="loading" role="status"><img src="/emblem.svg" alt=""><span>세계를 펼치는 중</span></div>
    </div>
    <section class="atlas-heading"><span class="eyebrow">THE WORLD OF WM</span><h1>세계 지도<span class="heading-dot">.</span></h1><p id="view-description">이야기는, 숲속 작은 집에서.</p></section>
    <div class="mode-switch" role="group" aria-label="지도 보기"><button id="map-mode" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/></svg>지도</button><button id="planet-mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>행성</button></div>
    <aside class="explorer" aria-label="장소 탐색">
      <button id="explorer-toggle" aria-expanded="true" aria-controls="explorer-content"><span>장소 찾아보기</span><span id="place-count">18</span><span class="chevron">⌃</span></button>
      <div id="explorer-content"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="이름이나 지역 검색" autocomplete="off" aria-label="장소 검색"><kbd>/</kbd></label>
      <div class="filters" role="group" aria-label="장소 분류"><button aria-pressed="true" data-filter="all">모두</button><button aria-pressed="false" data-filter="land">육지</button><button aria-pressed="false" data-filter="sea">바다</button></div><div id="place-list" tabindex="0" aria-label="장소 목록"></div><button id="more-places" hidden>다음 장소 보기 ↓</button></div>
    </aside>
    <section id="detail" class="detail" hidden aria-label="선택한 장소"><button id="close-detail" class="close" aria-label="장소 정보 닫기">×</button><div id="detail-art" aria-hidden="true"></div><div class="detail-body"><span id="detail-kind" class="eyebrow"></span><h2 id="detail-title"></h2><p id="detail-text"></p><p id="detail-source" class="source-note"></p><button id="focus-place" class="text-button">이 장소로 이동 <span>↗</span></button></div></section>
    <div class="map-controls" role="group" aria-label="탐색 도구"><button id="zoom-in" aria-label="확대" title="확대">+</button><button id="zoom-out" aria-label="축소" title="축소">−</button><span></span><button id="reset" aria-label="전체 보기" title="전체 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button id="toggle-labels" aria-label="지명 표시" aria-pressed="true" title="지명 표시">Aa</button><button id="view-settings-toggle" aria-label="표시 설정" aria-controls="view-settings" aria-expanded="false" title="표시 설정">표시</button><button id="help" aria-label="조작 도움말" title="조작 도움말">?</button></div>
    <div class="compass" aria-hidden="true"><span>N</span><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="31"/><path d="M50 3 59 41 97 50 59 59 50 97 41 59 3 50 41 41Z"/><path class="needle" d="M50 3 50 50 41 41Z M50 50 59 59 50 97Z"/><circle cx="50" cy="50" r="4"/></svg></div>
    <footer class="atlas-footer"><span><i></i> WITCH MENDOKUSAI <b>/</b> WORLD ATLAS</span><button id="source-button">첫 번째 지도 <span>↗</span></button><span id="interaction-hint">드래그로 이동,  스크롤로 확대</span></footer>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
    <div id="terrain-error" role="alert">상세 지형을 불러오지 못했어요. <button id="terrain-retry">다시 불러오기</button></div>
    <div id="terrain-loading" role="status">상세 지형을 불러오는 중</div>
    <div id="terrain-scale" aria-label="탐색 축척"><span></span><i></i></div>
  </main>
  <dialog id="dialog"><button id="close-dialog" class="close" aria-label="창 닫기">×</button><div id="dialog-body"></div></dialog>
  <script type="module" src="/src/main.mjs"></script>
</body>
</html>
