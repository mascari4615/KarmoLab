<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body class="no-transition">
    <div class="header">
        <h2>KarmoLab</h2>
        <button class="settings-btn" id="settings-btn" title="Open Extension Settings">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M9.1 4.4L8.6 2H7.4l-.5 2.4-.7.3-2-1.3-.9.8 1.3 2-.2.7-2.4.5v1.2l2.4.5.3.8-1.3 2 .8.8 2-1.3.8.3.4 2.4h1.2l.5-2.4.8-.3 2 1.3.8-.8-1.3-2 .3-.8 2.4-.5V7.4l-2.4-.5-.3-.8 1.3-2-.8-.8-2 1.3-.7-.3zM8 11c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/>
            </svg>
        </button>
    </div>

    <div id="card-list" class="card-list">
        <!-- Cards will be injected here -->
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const cardListContainer = document.getElementById('card-list');
        const settingsBtn = document.getElementById('settings-btn');
        let isInitialLoad = true;

        settingsBtn.addEventListener('click', () => {
            vscode.postMessage({ type: 'openSettings' });
        });

        window.addEventListener('message', event => {
            const message = event.data;
            if (message.type === 'updateState') {
                renderGroups(message.groups);
                
                if (isInitialLoad) {
                    setTimeout(() => {
                        document.body.classList.remove('no-transition');
                    }, 50);
                    isInitialLoad = false;
                }
            }
        });

        function renderGroups(groups) {
            cardListContainer.innerHTML = '';
            groups.forEach(group => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="feature-row">
                        <div class="feature-info">
                            <h3>${group.name}</h3>
                            <p>${group.isVisible ? 'Visible' : 'Hidden'}</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" ${group.isVisible ? 'checked' : ''} data-id="${group.id}">
                            <span class="slider"></span>
                        </label>
                    </div>
                `;
                
                const checkbox = card.querySelector('input');
                checkbox.addEventListener('change', () => {
                    vscode.postMessage({ 
                        type: 'toggleGroup', 
                        groupId: group.id 
                    });
                });
                
                cardListContainer.appendChild(card);
            });
        }

        vscode.postMessage({ type: 'refresh' });
    </script>
</body>
</html>
