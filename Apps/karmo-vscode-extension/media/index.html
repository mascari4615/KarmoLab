		</button>
	</header>

	<div id="card-list" class="card-list">
		<!-- Cards will be injected here -->
	</div>

	<div id="card-template" style="display: none;">
		{{cardTemplate}}
	</div>

	<footer>
		<p>Build: {{buildTime}}</p>
	</footer>

	<script src="{{scriptUri}}"></script>

</body>

</html>
